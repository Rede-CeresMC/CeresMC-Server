[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Rede-CeresMC/CeresMC-Server"
authors = ["Rede CeresMC"]

[workspace.dependencies]
ceres-codec = { path = "crates/ceres-codec" }
ceres-protocol = { path = "crates/ceres-protocol" }
ceres-net = { path = "crates/ceres-net" }
ceres-world = { path = "crates/ceres-world" }
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.2"
flate2 = "1.1.11"
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.10.4"
rtc = { version = "0.21.1", default-features = false }
rusty-leveldb = "4.0.2"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
webrtc = "0.21.1"

[profile.release]
lto = "thin"
codegen-units = 1
