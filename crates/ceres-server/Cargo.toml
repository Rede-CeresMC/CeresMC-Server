[package]
name = "ceres-server"
description = "CeresMC Server: Minecraft Bedrock server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ceres"
path = "src/main.rs"

[dependencies]
ceres-codec.workspace = true
ceres-protocol.workspace = true
ceres-net.workspace = true
ceres-world.workspace = true
base64.workspace = true
serde_json.workspace = true
rand.workspace = true
ctrlc = "3.5.2"
ureq = "3.5.2"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
p384 = { workspace = true, features = ["ecdsa", "pkcs8"] }
